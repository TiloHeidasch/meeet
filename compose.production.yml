name: meeet-production

services:
  # One-shot schedule rotation: fetches the latest MVV feed and compiles the
  # scheduled artifact when the mounted artifact is missing, stale, or built by
  # a different compiler version; otherwise keeps the current artifact. It
  # always exits 0, and meeet starts only after it completes successfully.
  compiler:
    image: ${MEEET_COMPILER_IMAGE}
    restart: "no"
    volumes:
      - type: bind
        source: ${MEEET_SCHEDULE_HOST_DIR}
        target: /output
        bind:
          create_host_path: false

  meeet:
    image: ${MEEET_IMAGE}
    restart: unless-stopped
    depends_on:
      compiler:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${MEEET_SCHEDULE_HOST_DIR}
        target: /opt/meeet/schedule
        read_only: true
        bind:
          create_host_path: false
    environment:
      NODE_ENV: production
      MEEET_PROVIDER_MODE: configured
      MEEET_PROVIDER_DEPLOYMENT: managed
      MEEET_SCHEDULE_ARTIFACT_PATH: /opt/meeet/schedule/mvv-scheduled-artifact.json
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/api/health/ready")
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      meeet:
        condition: service_healthy