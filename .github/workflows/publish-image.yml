name: Publish GHCR images

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Node 24
    uses: ./.github/workflows/validate.yml

  publish:
    name: Publish images
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Normalize GHCR owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract runner image metadata
        id: meta_runner
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/meeet
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and publish runner
        id: build_runner
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_runner.outputs.tags }}
          labels: ${{ steps.meta_runner.outputs.labels }}
          build-args: |
            NODE_IMAGE=node:24-bookworm-slim@sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03
          cache-from: type=gha,scope=meeet-runner
          cache-to: type=gha,mode=max,scope=meeet-runner
          # BuildKit publishes the SLSA provenance attestation with the image.
          provenance: mode=max
          sbom: true

      # dev and feature branch pushes publish the runner only; main and
      # release tags additionally publish the compiler.
      - name: Extract compiler image metadata
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        id: meta_compiler
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/meeet-artifact-compiler
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and publish compiler
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        id: build_compiler
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          target: artifact-compiler
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_compiler.outputs.tags }}
          labels: ${{ steps.meta_compiler.outputs.labels }}
          build-args: |
            NODE_IMAGE=node:24-bookworm-slim@sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03
          cache-from: type=gha,scope=meeet-compiler
          cache-to: type=gha,mode=max,scope=meeet-compiler
          provenance: mode=max
          sbom: true

      - name: Write digest-pinned deployment references
        env:
          GHCR_OWNER: ${{ steps.owner.outputs.owner }}
          RUNNER_DIGEST: ${{ steps.build_runner.outputs.digest }}
          COMPILER_DIGEST: ${{ steps.build_compiler.outputs.digest }}
        run: |
          {
            echo "### Digest-pinned deployment references"
            echo
            echo 'Use these immutable references in the operator-owned runtime .env; branch and release tags are publication conveniences only.'
            echo
            echo '```dotenv'
            echo "MEEET_IMAGE=ghcr.io/${GHCR_OWNER}/meeet@${RUNNER_DIGEST}"
            if [ -n "${COMPILER_DIGEST}" ]; then
              echo "MEEET_COMPILER_IMAGE=ghcr.io/${GHCR_OWNER}/meeet-artifact-compiler@${COMPILER_DIGEST}"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
